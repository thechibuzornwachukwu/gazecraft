<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puzzles, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#f6f6f7}
a{color:#111113}a:hover{color:#000000}
</style>
</helmet>
<div style="min-height: 860px; background: #f6f6f7; font-family: Manrope, system-ui, sans-serif; color: #111113">

  <header style="border-bottom: 1px solid #e3e3e7">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
      <a href="#home" aria-label="Gazecraft home" style="display: flex; align-items: center; gap: 8px; text-decoration: none">
        <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: #454552; display: grid; place-items: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4f04c" stroke-width="2.6" stroke-linecap="round"><circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/></svg>
        </span>
        <span style="font-family: Bungee, Manrope, sans-serif; font-size: 22px; color: #111113">GAZECRAFT</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; font-size: 15px; font-weight: 600">
        <a href="#puzzles" aria-current="page" style="text-decoration: none; color: #111113">Puzzles</a>
        <a href="#people" style="text-decoration: none; color: #6a6a72">People</a>
        <a href="#league" style="text-decoration: none; color: #6a6a72">League</a>
      </nav>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 16px">
        <a href="#signin" style="font-size: 14px; font-weight: 600; color: #55555c; text-decoration: none">Sign in</a>
        <a href="#you" aria-label="You and your pet" style="display: flex; padding: 3px; border: 1px solid #d6d6db; border-radius: 999px; background: #ffffff; text-decoration: none">
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #d48cff; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #111113">A</span>
          <span aria-hidden="true" style="width: 28px; height: 28px; margin-left: -6px; border-radius: 50%; background: #454552; border: 2px solid #ffffff"></span>
        </a>
      </div>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 80px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">

    <section aria-labelledby="next-title" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px">
        <h1 id="next-title" style="margin: 0; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: -0.015em; color: #2c2c2e">SHORT NOTE</h1>
        <p style="margin: 0; font-size: 15px; font-weight: 600; color: #55555c">Bible · puzzle 1 of 5</p>
      </div>

      <ol aria-label="Puzzle 1 of 5" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <li style="height: 6px; border-radius: 3px; background: #111113"></li>
        <li style="height: 6px; border-radius: 3px; background: #d6d6db"></li>
        <li style="height: 6px; border-radius: 3px; background: #d6d6db"></li>
        <li style="height: 6px; border-radius: 3px; background: #d6d6db"></li>
        <li style="height: 6px; border-radius: 3px; background: #d6d6db"></li>
      </ol>

      <div style="display: flex; flex-direction: column; gap: 24px; padding: 36px 40px; background: #ffffff; border: 1px solid #e3e3e7; border-radius: 14px">
        <p style="margin: 0; max-width: 30ch; font-size: 30px; font-weight: 600; line-height: 1.55; letter-spacing: -0.02em; color: #2a2a2e">I have a remark to make. The flu kept me in bed for a most boring week. Jo, eleven days later, gave me the facts.</p>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
          <a href="#play" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 28px; border-radius: 8px; background: #111113; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none">
            Find the 5 books of the Bible
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </a>
          <a href="#together" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 600; color: #55555c; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: #c4c4ca">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Play with a friend
          </a>
        </div>
      </div>
    </section>

    <section aria-labelledby="packs-title" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <h2 id="packs-title" style="margin: 0 0 10px; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 18px; color: #2c2c2e">PACKS</h2>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-top: 1px solid #e3e3e7">
        <sc-for list="{{packs}}" as="p" hint-placeholder-count="9">
          <li style="border-bottom: 1px solid #e3e3e7">
            <a href="#pack" style="display: flex; align-items: center; gap: 14px; min-height: 56px; text-decoration: none; color: #111113">
              <span aria-hidden="true" style="width: 12px; height: 12px; flex: none; border-radius: 4px; background: {{p.hue}}"></span>
              <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em">{{p.title}}</span>
              <span style="font-size: 13px; font-weight: 600; color: #6a6a72">{{p.meta}}</span>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const P = { bible: '#f06a5a', science: '#9b8cff', ai: '#d48cff', history: '#f2c94c', general: '#6aa3ff', names: '#ff9f43' };
    const packs = [
      ['Road trip', 7, P.bible],
      ['The classic', 13, P.bible],
      ['In the lab', 9, P.science],
      ['Night drive', 7, P.science],
      ['Match day', 8, P.ai],
      ['Lake weekend', 6, P.history],
      ['Hidden colours', 7, P.general],
      ['Nigerian names', 11, P.names],
      ['Market day', 8, P.general],
    ];
    return { packs: packs.map(([title, n, hue]) => ({ title, hue, meta: n + ' puzzles' })) };
  }
}
</script>
</body>
</html>
