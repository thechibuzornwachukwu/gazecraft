<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puzzles, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#f6f6f7}
a{color:#111113}a:hover{color:#000000}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes nudge{0%,62%,100%{transform:translateX(0) rotate(0)}70%{transform:translateX(26px) rotate(3deg)}80%{transform:translateX(-6px) rotate(-1deg)}88%{transform:translateX(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(212,240,76,0)}50%{box-shadow:0 0 0 5px rgba(212,240,76,.45)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(-10px)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(12deg)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.1) rotate(3deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.nudge{animation:nudge 3.2s ease-in-out 1s infinite}
.glow{animation:glow 1.8s ease-in-out infinite}
.hop{animation:hop 1.4s ease-in-out infinite}
.twinkle{animation:twinkle 2.2s ease-in-out infinite}
.flame{animation:flame 1.1s ease-in-out infinite;transform-origin:50% 90%}
.pop{animation:pop .35s ease-out both}
.cheer{animation:cheer 1.6s ease-in-out infinite}
.rise{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.bob,.nudge,.glow,.hop,.twinkle,.flame,.pop,.cheer,.rise{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f6f7; font-family: Manrope, system-ui, sans-serif; color: #111113">

  <main style="padding: 44px 18px 140px; display: flex; flex-direction: column; gap: 20px">
    <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Puzzles</h1>

    <sc-if value="{{returning}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 8px">
        <span aria-label="3 days in a row" style="display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px 0 6px; border-radius: 999px; background: #ffffff; border: 1px solid #e3e3e7; font-size: 15px; font-weight: 800">
          <img class="flame" src="/_blob/05ee42fd226623caa242489e39309c3a" alt="" style="width: 26px; height: 26px">3
        </span>
        <span aria-label="5 stars" style="display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px 0 6px; border-radius: 999px; background: #ffffff; border: 1px solid #e3e3e7; font-size: 15px; font-weight: 800">
          <img class="twinkle" src="/_blob/e0a30d7867daccf828ee24febdd83699" alt="" style="width: 24px; height: 24px">5
        </span>
      </div>
    </sc-if>

    <section aria-label="Mochi" style="display: flex; align-items: flex-end; gap: 10px">
      <img class="bob" src="{{mochi}}" alt="Mochi the cat" style="width: 96px; height: auto; flex: none">
      <p role="status" class="pop" style="margin: 0 0 30px; padding: 14px 16px; background: #111113; color: #ffffff; border-radius: 18px 18px 18px 4px; font-size: 16px; font-weight: 700; line-height: 1.35">{{say}}</p>
    </section>

    <section aria-label="Cases" style="display: flex; flex-direction: column; align-items: center; gap: 16px">
      <div style="position: relative; width: 340px; height: 360px">
        <div aria-hidden="true" style="position: absolute; inset: 0; transform: translateY(18px) scale(.9) rotate(5deg); background: #ffffff; border: 1px solid #e3e3e7; border-radius: 22px; box-shadow: 0 6px 0 #e3e3e7">
          <div style="height: 64px; border-radius: 22px 22px 0 0; background: {{c3.hue}}"></div>
        </div>
        <div aria-hidden="true" style="position: absolute; inset: 0; transform: translateY(9px) scale(.95) rotate(-3deg); background: #ffffff; border: 1px solid #e3e3e7; border-radius: 22px; box-shadow: 0 6px 0 #e3e3e7">
          <div style="height: 64px; border-radius: 22px 22px 0 0; background: {{c2.hue}}; display: flex; align-items: center; gap: 10px; padding: 0 18px">
            <sc-if value="{{c2.icon}}" hint-placeholder-val="{{ true }}"><img src="{{c2.icon}}" alt="" style="width: 40px; height: 40px"></sc-if>
            <span style="font-family: Bungee, Manrope, sans-serif; font-size: 18px; color: #141416">{{c2.title}}</span>
          </div>
        </div>
        <article class="{{topClass}}" aria-label="{{top.aria}}" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" style="position: absolute; inset: 0; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #d6d6db; border-radius: 22px; box-shadow: 0 8px 0 #d6d6db; touch-action: pan-y; user-select: none; cursor: grab; transform: {{topTransform}}; transition: {{topTransition}}">
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 21px 21px 0 0; background: {{top.hue}}">
            <sc-if value="{{top.icon}}" hint-placeholder-val="{{ true }}"><img src="{{top.icon}}" alt="" style="width: 52px; height: 52px"></sc-if>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <h2 style="margin: 0; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 21px; line-height: 1.05; color: #141416">{{top.title}}</h2>
              <span style="font-size: 13px; font-weight: 800; color: #141416">{{top.tag}}</span>
            </div>
          </div>
          <p style="margin: 0; padding: 16px 20px 0; flex: 1; font-size: 21px; font-weight: 600; line-height: 1.6; letter-spacing: -0.01em; color: #2a2a2e"><sc-for list="{{top.parts}}" as="pt" hint-placeholder-count="3"><sc-if value="{{pt.hit}}" hint-placeholder-val="{{ false }}"><mark class="glow" style="padding: 1px 2px; border-radius: 5px; background: #d4f04c; color: #0d0d0e">{{pt.t}}</mark></sc-if><sc-if value="{{pt.plain}}" hint-placeholder-val="{{ true }}">{{pt.t}}</sc-if></sc-for></p>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 20px 16px">
            <span style="font-size: 13px; font-weight: 700; color: #5a6b00">{{top.found}} is hiding in there. Find the rest.</span>
            <ol aria-label="{{top.progress}}" style="margin: 0; padding: 0; list-style: none; display: flex; gap: 4px; flex: none">
              <sc-for list="{{top.stones}}" as="s" hint-placeholder-count="5">
                <li style="width: 12px; height: 8px; border-radius: 50%; background: {{s}}"></li>
              </sc-for>
            </ol>
          </div>
          <span aria-hidden="true" style="position: absolute; top: 92px; left: 16px; padding: 4px 12px; border: 3px solid #5a6b00; border-radius: 8px; transform: rotate(-12deg); font-family: Bungee, Manrope, sans-serif; font-size: 22px; color: #5a6b00; background: #f4fbd6; opacity: {{yesOpacity}}">PLAY!</span>
          <span aria-hidden="true" style="position: absolute; top: 92px; right: 16px; padding: 4px 12px; border: 3px solid #55555c; border-radius: 8px; transform: rotate(12deg); font-family: Bungee, Manrope, sans-serif; font-size: 22px; color: #55555c; background: #f6f6f7; opacity: {{noOpacity}}">LATER</span>
        </article>
      </div>

      <sc-if value="{{picked}}" hint-placeholder-val="{{ false }}">
        <a class="pop" href="GamePhone.dc.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 28px; border-radius: 999px; background: #d4f04c; box-shadow: 0 6px 0 #a8c22c; color: #0d0d0e; font-size: 17px; font-weight: 800; text-decoration: none">
          Open the case
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
      </sc-if>
      <sc-if value="{{choosing}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 22px">
          <button type="button" onClick="{{later}}" aria-label="Later" style="width: 60px; height: 60px; border-radius: 50%; border: 1px solid #d6d6db; background: #ffffff; box-shadow: 0 4px 0 #d6d6db; display: grid; place-items: center; cursor: pointer">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#55555c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </button>
          <a href="GamePhone.dc.html" aria-label="Play this case" style="width: 84px; height: 84px; border-radius: 50%; background: #d4f04c; box-shadow: 0 6px 0 #a8c22c; display: grid; place-items: center; text-decoration: none">
            <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="#0d0d0e"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          </a>
          <a href="GamePhone.dc.html" aria-label="Play with a friend" style="width: 60px; height: 60px; border-radius: 50%; border: 1px solid #d6d6db; background: #ffffff; box-shadow: 0 4px 0 #d6d6db; display: grid; place-items: center">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4f8dff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </a>
        </div>
      </sc-if>
      <button type="button" onClick="{{openShelf}}" style="min-height: 44px; padding: 0 12px; border: none; background: none; font: inherit; font-size: 14px; font-weight: 700; color: #55555c; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: #c4c4ca; cursor: pointer">All 25 cases</button>
    </section>

    <section aria-labelledby="team-title" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #111113; color: #ffffff; border-radius: 20px">
      <h2 id="team-title" style="margin: 0; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 16px">TEAM</h2>
      <div style="display: flex; align-items: flex-end; gap: 6px">
        <img class="cheer" src="/_blob/72ac21c6abd315fc09fce9f4cd789575" alt="Mochi" style="width: 66px; height: auto">
          <sc-for list="{{locked}}" as="l" hint-placeholder-count="3">
            <div style="position: relative; width: 58px; height: 76px; flex: none; display: grid; place-items: center; border-radius: 14px; background: #2a2a2e">
              <img src="{{l.src}}" alt="A pet still to choose" style="width: 48px; height: auto; filter: brightness(0); opacity: .9">
              <span aria-hidden="true" class="twinkle" style="position: absolute; top: 2px; right: 5px; font-family: Bungee, Manrope, sans-serif; font-size: 18px; color: #d4f04c">?</span>
            </div>
          </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <p style="margin: 0; font-size: 15px; font-weight: 800">{{unlockLine}}</p>
        <div role="progressbar" aria-valuemin="0" aria-valuemax="3000" aria-valuenow="{{points}}" aria-label="{{pointsLabel}}" style="height: 12px; border-radius: 6px; background: #3a3a40; overflow: hidden">
          <div style="width: {{pointsPct}}; height: 100%; border-radius: 6px; background: #d4f04c"></div>
        </div>
        <span style="font-size: 13px; font-weight: 700; color: #c4c4ca">{{pointsLabel}}</span>
      </div>
    </section>
  </main>

  <nav aria-label="Tabs" style="position: absolute; left: 12px; right: 12px; bottom: 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px; background: #ffffff; border: 1px solid #e3e3e7; border-radius: 22px; box-shadow: 0 4px 0 #e3e3e7">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border-radius: 14px; background: #e9f8f0; border: 2px solid #3ec486; text-decoration: none; color: #111113">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f8a58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
      <span style="font-size: 11px; font-weight: 800">Puzzles</span>
    </a>
    <a href="PeoplePhone.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; color: #55555c">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f6fe0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
      <span style="font-size: 11px; font-weight: 800">People</span>
    </a>
    <a href="LeaguePhone.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; color: #55555c">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a6100" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span style="font-size: 11px; font-weight: 800">League</span>
    </a>
    <a href="YouPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; color: #55555c">
      <img src="/_blob/7f7dc653e8bd7e13eaad2bdac65ebe80" alt="" style="width: 24px; height: 24px; border-radius: 50%">
      <span style="font-size: 11px; font-weight: 800">You</span>
    </a>
  </nav>

  <sc-if value="{{shelf}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(17,17,19,.45); display: flex; align-items: flex-end">
      <section role="dialog" aria-modal="true" aria-labelledby="shelf-title" class="rise" style="width: 100%; max-height: 78%; overflow-y: auto; box-sizing: border-box; padding: 18px 18px 28px; background: #f6f6f7; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h2 id="shelf-title" style="margin: 0; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 20px; color: #2c2c2e">ALL CASES</h2>
          <button type="button" onClick="{{closeShelf}}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #d6d6db; background: #ffffff; display: grid; place-items: center; cursor: pointer">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55555c" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{shelfList}}" as="c" hint-placeholder-count="8">
            <li>
              <button type="button" onClick="{{c.choose}}" style="width: 100%; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 12px; border: 1px solid #e3e3e7; border-radius: 18px; background: {{c.hue}}; box-shadow: 0 5px 0 #e3e3e7; text-align: left; font: inherit; cursor: pointer">
                <span style="font-family: Bungee, Manrope, sans-serif; font-size: 14px; line-height: 1.1; color: #141416">{{c.title}}</span>
                <span style="font-size: 12px; font-weight: 800; color: #141416">{{c.meta}}</span>
              </button>
            </li>
          </sc-for>
        </ul>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"player":{"editor":"enum","options":["returning","new"],"default":"returning"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, dx: 0, drag: false, leaving: 0, picked: null, touched: false, shelf: false };
    this.startX = 0;
  }
  cases(returning) {
    const seg = (text, from, to) => [
      { t: text.slice(0, from), hit: false, plain: true },
      { t: text.slice(from, to), hit: true, plain: false },
      { t: text.slice(to), hit: false, plain: true },
    ];
    const span = (text, start, word) => start + word.length + (text.slice(start, start + word.length + 3).match(/[^A-Za-z]/g) || []).length;
    const stones = (done, total) => Array.from({ length: total }, (_, k) => (k < done ? '#111113' : k === done ? '#d4f04c' : '#e3e3e7'));
    const make = (o) => ({ ...o, parts: seg(o.text, o.start, span(o.text, o.start, o.found)), stones: stones(o.done, o.total), progress: o.done + ' of ' + o.total + ' done', aria: o.title + ', ' + o.tag });
    const list = [
      make({ title: 'IN THE LAB', tag: 'Science · new case', hue: '#c9c0ff', icon: '/_blob/7635086556d8c6e73873e2f04285f82e', text: 'Pat omitted one detail at the lab.', found: 'ATOM', start: 1, done: 0, total: 9 }),
      make({ title: 'PITCH SIDE', tag: 'Football · new case', hue: '#a6e9ee', icon: '/_blob/f6a3715fa4c1c5b2b0268cba7182e2a3', text: 'Sal, ahead of us, was the first to order.', found: 'SALAH', start: 0, done: 0, total: 7 }),
      make({ title: 'NIGHT DRIVE', tag: 'Science · new case', hue: '#c9c0ff', icon: '/_blob/c63465f1ba526143e4af88d655f94be3', text: 'Kim, Arsenal fan since seven, us included, drove up Luton way.', found: 'MARS', start: 2, done: 0, total: 7 }),
      make({ title: 'MARKET DAY', tag: 'General · new case', hue: '#c7dcff', icon: '/_blob/2b9bef2bf4c6af4f00c5afc2fbb298b5', text: 'Adele, Monday came long before we planned.', found: 'LEMON', start: 3, done: 0, total: 8 }),
      make({ title: 'SHIP SHAPE', tag: 'General · new case', hue: '#c7dcff', icon: '/_blob/7fb250dd3c5251cd91cf189dba756682', text: 'Pati, Gerry and I sailed on the ship, pots rattling in the hot terrace kitchen.', found: 'TIGER', start: 2, done: 0, total: 8 }),
    ];
    // A returning player sees the case they are in the middle of first.
    const going = make({ title: 'SHORT NOTE', tag: 'Bible · puzzle 3 of 5', hue: '#ffc9c2', icon: '/_blob/b676ec2223e29afc2a84e4d20067d69c', text: 'Jo, eleven days later, gave me the facts.', found: 'JOEL', start: 0, done: 2, total: 5 });
    return returning ? [going, ...list] : list;
  }
  renderVals() {
    const returning = (this.props.player ?? 'returning') === 'returning';
    const list = this.cases(returning);
    const n = list.length;
    const s = this.state;
    const shift = s.leaving ? s.leaving * 520 : s.dx;
    const lean = Math.max(-1, Math.min(1, shift / 110));
    const fly = (dir) => {
      if (this.state.leaving || this.state.picked) return;
      const card = list[this.state.i % n];
      this.setState({ leaving: dir, touched: true });
      setTimeout(() => this.setState({ i: dir > 0 ? this.state.i : this.state.i + 1, dx: 0, drag: false, leaving: 0, picked: dir > 0 ? card.title : null }), 280);
    };
    const cap = (t) => t.charAt(0) + t.slice(1).toLowerCase();
    const points = returning ? 1240 : 0;
    const NEXT = 3000;
    const all = [
      ['Short note', 'Bible', 5, '#ffc9c2'], ['Road trip', 'Bible', 7, '#ffc9c2'], ['The classic', 'Bible', 13, '#ffc9c2'], ['People of the Bible', 'Bible', 10, '#ffc9c2'],
      ['In the lab', 'Science', 9, '#c9c0ff'], ['Night drive', 'Science', 7, '#c9c0ff'], ['Car trouble', 'Science', 7, '#c9c0ff'], ['Match day', 'AI', 8, '#efcfff'],
      ['A walk with Linda', 'AI', 7, '#efcfff'], ['Lake weekend', 'History', 6, '#fbe7a6'], ['Party time', 'History', 7, '#fbe7a6'], ['Hidden colours', 'General', 7, '#c7dcff'],
      ['Ship shape', 'General', 8, '#c7dcff'], ['Market day', 'General', 8, '#c7dcff'], ['Pitch side', 'Football', 7, '#a6e9ee'], ['Football legends', 'Football', 6, '#a6e9ee'],
      ['Nigerian names', 'Names', 11, '#ffd9b0'], ['French names', 'Names', 7, '#ffd9b0'], ['Names around the world', 'Names', 8, '#ffd9b0'], ['Art class', 'Health', 9, '#ffc8dc'],
      ['Medicine and nursing', 'Health', 10, '#ffc8dc'], ['Party at ours', 'Naija', 7, '#bff0d8'], ['Farm visit', 'Naija', 8, '#bff0d8'], ['Aunty Mary', 'Naija', 8, '#bff0d8'], ['Band practice', 'Naija', 8, '#bff0d8'],
    ];
    const shelfList = all.map(([title, cat, total, hue]) => ({
      title: title.toUpperCase(),
      meta: (returning && title === 'Short note' ? '2 of 5 done' : total + ' puzzles') + ' · ' + cat,
      hue,
      choose: () => this.setState({ shelf: false, picked: title.toUpperCase(), touched: true }),
    }));
    const picked = !!s.picked;
    return {
      returning,
      top: list[s.i % n],
      c2: list[(s.i + 1) % n],
      c3: list[(s.i + 2) % n],
      mochi: picked ? '/_blob/d187597c53c1f65f02e75d28f635beff' : '/_blob/72ac21c6abd315fc09fce9f4cd789575',
      say: picked ? 'Great pick! ' + cap(s.picked) + ' it is. Ready, detective?' : s.touched ? 'No problem. How about this one?' : returning ? 'Welcome back, Ada! Short note is waiting. Swipe right to go on.' : 'Hi, detective! I am Mochi. Swipe right on a case you like.',
      picked,
      choosing: !picked,
      topClass: s.touched || s.drag ? '' : 'nudge',
      topTransform: 'translateX(' + shift + 'px) rotate(' + shift / 16 + 'deg)',
      topTransition: s.drag ? 'none' : 'transform .28s cubic-bezier(.2,.8,.2,1)',
      yesOpacity: Math.max(0, lean),
      noOpacity: Math.max(0, -lean),
      later: () => fly(-1),
      play: () => fly(1),
      down: (e) => { if (this.state.picked) return; this.startX = e.clientX; if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); this.setState({ drag: true, touched: true }); },
      move: (e) => { if (this.state.drag) this.setState({ dx: e.clientX - this.startX }); },
      up: () => { if (!this.state.drag) return; const dx = this.state.dx; this.setState({ drag: false }); if (Math.abs(dx) > 90) fly(dx < 0 ? -1 : 1); else this.setState({ dx: 0 }); },
      shelf: s.shelf,
      shelfList,
      openShelf: () => this.setState({ shelf: true }),
      closeShelf: () => this.setState({ shelf: false }),
      points,
      locked: [{ src: '/_blob/2fa91e21cde51d51069fa9063f56cfe3' }, { src: '/_blob/b325ff236415e58d329c7d73f4a47fb4' }, { src: '/_blob/72507b15ee8cfb2fb62e1d386f82ae8b' }],
      pointsPct: Math.round((points / NEXT) * 100) + '%',
      pointsLabel: points.toLocaleString('en-GB') + ' / 3,000 points',
      unlockLine: returning ? 'A new pet joins you at 3,000 points. You choose who.' : 'Find words to earn points. At 3,000 a new pet joins you.',
    };
  }
}
</script>
