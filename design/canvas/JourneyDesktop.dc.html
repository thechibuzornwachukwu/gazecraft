<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puzzles, desktop, journey</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#f6f6f7}
a{color:#111113}a:hover{color:#000000}
</style>
</helmet>
<div style="min-height: 860px; background: #f6f6f7; font-family: Manrope, system-ui, sans-serif; color: #111113">

  <header style="border-bottom: 1px solid #e3e3e7">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
      <a href="#home" aria-label="Gazecraft home" style="display: flex; align-items: center; gap: 8px; text-decoration: none">
        <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: #454552; display: grid; place-items: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4f04c" stroke-width="2.6" stroke-linecap="round"><circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/></svg>
        </span>
        <span style="font-family: Bungee, Manrope, sans-serif; font-size: 22px; color: #111113">GAZECRAFT</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; font-size: 15px; font-weight: 600">
        <a href="#puzzles" aria-current="page" style="text-decoration: none; color: #111113">Puzzles</a>
        <a href="#people" style="text-decoration: none; color: #6a6a72">People</a>
        <a href="#league" style="text-decoration: none; color: #6a6a72">League</a>
      </nav>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 16px">
        <a href="#you" aria-label="You and your pet" style="display: flex; padding: 3px; border: 1px solid #d6d6db; border-radius: 999px; background: #ffffff; text-decoration: none">
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #d48cff; display: grid; place-items: center; font-size: 12px; font-weight: 800">A</span>
          <span aria-hidden="true" style="width: 28px; height: 28px; margin-left: -6px; border-radius: 50%; background: #454552; border: 2px solid #ffffff"></span>
        </a>
      </div>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 44px 24px 80px; display: flex; flex-direction: column; gap: 36px">

    <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px">
      <h1 style="margin: 0; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 44px; line-height: 1; color: #2c2c2e">SHORT NOTE</h1>
      <p style="margin: 0; font-size: 15px; font-weight: 600; color: #55555c">Bible · 2 of 5 done · 5 stars</p>
    </div>

    <nav aria-label="Journey" style="overflow-x: auto; padding: 18px 28px; background: #ffffff; border: 1px solid #e3e3e7; border-radius: 14px">
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; width: max-content">
        <sc-for list="{{stops}}" as="s" hint-placeholder-count="14">
          <li style="display: flex; align-items: center">
            <sc-if value="{{s.line}}" hint-placeholder-val="{{ true }}">
              <span aria-hidden="true" style="width: 34px; height: 3px; border-radius: 2px; background: {{s.lineColor}}"></span>
            </sc-if>
            <sc-if value="{{s.flag}}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 10px">
                <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: {{s.hue}}"></span>
                <span style="font-family: Bungee, Manrope, sans-serif; font-size: 12px; color: #55555c; white-space: nowrap">{{s.label}}</span>
              </span>
            </sc-if>
            <sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}">
              <a href="#replay" aria-label="{{s.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none">
                <span style="width: 48px; height: 48px; border-radius: 50%; background: #111113; display: grid; place-items: center">
                  <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d4f04c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
                </span>
                <span aria-hidden="true" style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #5a6b00">{{s.stars}}</span>
              </a>
            </sc-if>
            <sc-if value="{{s.now}}" hint-placeholder-val="{{ false }}">
              <a href="#play" aria-label="{{s.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none">
                <span style="width: 62px; height: 62px; border-radius: 50%; background: #d4f04c; display: grid; place-items: center; box-shadow: 0 0 0 4px #ffffff, 0 0 0 6px #d4f04c">
                  <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; background: #d48cff; display: grid; place-items: center; font-size: 16px; font-weight: 800">A</span>
                </span>
                <span style="font-size: 12px; font-weight: 800">Now</span>
              </a>
            </sc-if>
            <sc-if value="{{s.ahead}}" hint-placeholder-val="{{ false }}">
              <span aria-label="{{s.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: {{s.fade}}">
                <span style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 50%; background: #ffffff; border: 2px solid {{s.ring}}; display: grid; place-items: center; font-size: 16px; font-weight: 800; color: #55555c">{{s.n}}</span>
                <span aria-hidden="true" style="height: 16px"></span>
              </span>
            </sc-if>
          </li>
        </sc-for>
      </ol>
    </nav>

    <div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">
      <section aria-label="Puzzle 3" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px; padding: 36px 40px; background: #ffffff; border: 1px solid #e3e3e7; border-radius: 14px">
        <p style="margin: 0; font-size: 15px; font-weight: 700; color: #55555c">Puzzle 3</p>
        <p style="margin: 0; max-width: 30ch; font-size: 30px; font-weight: 600; line-height: 1.55; letter-spacing: -0.02em; color: #2a2a2e">Jo, eleven days later, gave me the facts. The truth is, the job was done.</p>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
          <a href="#play" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 28px; border-radius: 8px; background: #111113; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none">
            Find them
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </a>
          <a href="#together" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 600; color: #55555c; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: #c4c4ca">Play with a friend</a>
        </div>
      </section>

      <section aria-labelledby="packs-title" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <h2 id="packs-title" style="margin: 0 0 10px; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 18px; color: #2c2c2e">OTHER PACKS</h2>
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-top: 1px solid #e3e3e7">
          <sc-for list="{{packs}}" as="p" hint-placeholder-count="6">
            <li style="border-bottom: 1px solid #e3e3e7">
              <a href="#pack" style="display: flex; align-items: center; gap: 14px; min-height: 56px; text-decoration: none; color: #111113">
                <span aria-hidden="true" style="width: 12px; height: 12px; flex: none; border-radius: 4px; background: {{p.hue}}"></span>
                <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 700">{{p.title}}</span>
                <span style="font-size: 13px; font-weight: 600; color: #6a6a72">{{p.meta}}</span>
              </a>
            </li>
          </sc-for>
        </ul>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const off = { flag: false, done: false, now: false, ahead: false };
    const ahead = (n, fade, aria) => ({ ...off, line: true, lineColor: fade < 1 ? '#e3e3e7' : '#d6d6db', ahead: true, n, ring: fade < 1 ? '#d6d6db' : '#c4c4ca', fade, aria });
    const stops = [
      { ...off, line: false, done: true, stars: '★★★', aria: 'Puzzle 1, 3 stars. Play again' },
      { ...off, line: true, lineColor: '#111113', done: true, stars: '★★', aria: 'Puzzle 2, 2 stars. Play again' },
      { ...off, line: true, lineColor: '#111113', now: true, aria: 'Puzzle 3, next' },
      ahead(4, 1, 'Puzzle 4, after puzzle 3'),
      ahead(5, 1, 'Puzzle 5, the last of the pack'),
      { ...off, line: true, lineColor: '#d6d6db', flag: true, hue: '#f06a5a', label: 'ROAD TRIP' },
      ahead(1, 0.6, 'Road trip, puzzle 1'),
      ahead(2, 0.55, 'Road trip, puzzle 2'),
      ahead(3, 0.5, 'Road trip, puzzle 3'),
      ahead(4, 0.45, 'Road trip, puzzle 4'),
      ahead(5, 0.4, 'Road trip, puzzle 5'),
      ahead(6, 0.35, 'Road trip, puzzle 6'),
      ahead(7, 0.3, 'Road trip, puzzle 7'),
      { ...off, line: true, lineColor: '#e3e3e7', flag: true, hue: '#f06a5a', label: 'THE CLASSIC' },
    ];
    const packs = [
      ['In the lab', '0 of 9', '#9b8cff'],
      ['Night drive', '0 of 7', '#9b8cff'],
      ['Match day', '0 of 8', '#d48cff'],
      ['Hidden colours', '0 of 7', '#6aa3ff'],
      ['Nigerian names', '0 of 11', '#ff9f43'],
      ['Market day', '0 of 8', '#6aa3ff'],
    ];
    return { stops, packs: packs.map(([title, meta, hue]) => ({ title, meta, hue })) };
  }
}
</script>
</body>
</html>
