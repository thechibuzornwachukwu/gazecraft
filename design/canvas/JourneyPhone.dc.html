<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puzzles, phone, journey</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#f6f6f7}
a{color:#111113}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; position: relative; background: #f6f6f7; font-family: Manrope, system-ui, sans-serif; color: #111113; overflow: hidden">

  <main style="padding: 52px 0 140px; display: flex; flex-direction: column; gap: 24px">

    <div style="padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <h1 style="margin: 0; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 26px; line-height: 1.05; color: #2c2c2e">SHORT NOTE</h1>
        <p style="margin: 0; font-size: 14px; font-weight: 600; color: #55555c">Bible · 2 of 5 done · 5 stars</p>
      </div>
      <a href="#you" aria-label="You and your pet" style="display: flex; flex: none; padding: 3px; border: 1px solid #d6d6db; border-radius: 999px; background: #ffffff; text-decoration: none">
        <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #d48cff; display: grid; place-items: center; font-size: 13px; font-weight: 800">A</span>
        <span aria-hidden="true" style="width: 34px; height: 34px; margin-left: -6px; border-radius: 50%; background: #454552; border: 2px solid #ffffff"></span>
      </a>
    </div>

    <nav aria-label="Journey" style="overflow-x: auto; padding: 4px 0 8px">
      <ol style="margin: 0; padding: 0 20px; list-style: none; display: flex; align-items: center; width: max-content">
        <sc-for list="{{stops}}" as="s" hint-placeholder-count="10">
          <li style="display: flex; align-items: center">
            <sc-if value="{{s.line}}" hint-placeholder-val="{{ true }}">
              <span aria-hidden="true" style="width: 22px; height: 3px; border-radius: 2px; background: {{s.lineColor}}"></span>
            </sc-if>
            <sc-if value="{{s.flag}}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 8px">
                <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: {{s.hue}}"></span>
                <span style="font-family: Bungee, Manrope, sans-serif; font-size: 11px; color: #55555c; white-space: nowrap">{{s.label}}</span>
              </span>
            </sc-if>
            <sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}">
              <a href="#replay" aria-label="{{s.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none">
                <span style="width: 44px; height: 44px; border-radius: 50%; background: #111113; display: grid; place-items: center">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4f04c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
                </span>
                <span aria-hidden="true" style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #5a6b00">{{s.stars}}</span>
              </a>
            </sc-if>
            <sc-if value="{{s.now}}" hint-placeholder-val="{{ false }}">
              <a href="#play" aria-label="{{s.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none">
                <span style="width: 58px; height: 58px; border-radius: 50%; background: #d4f04c; display: grid; place-items: center; box-shadow: 0 0 0 4px #ffffff, 0 0 0 6px #d4f04c">
                  <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #d48cff; display: grid; place-items: center; font-size: 15px; font-weight: 800">A</span>
                </span>
                <span style="font-size: 11px; font-weight: 800; color: #111113">Now</span>
              </a>
            </sc-if>
            <sc-if value="{{s.ahead}}" hint-placeholder-val="{{ false }}">
              <span aria-label="{{s.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: {{s.fade}}">
                <span style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: #ffffff; border: 2px solid {{s.ring}}; display: grid; place-items: center; font-size: 15px; font-weight: 800; color: #55555c">{{s.n}}</span>
                <span aria-hidden="true" style="height: 15px"></span>
              </span>
            </sc-if>
          </li>
        </sc-for>
      </ol>
    </nav>

    <div style="margin: 0 20px; display: flex; flex-direction: column; gap: 18px; padding: 22px 20px 20px; background: #ffffff; border: 1px solid #e3e3e7; border-radius: 14px">
      <p style="margin: 0; font-size: 14px; font-weight: 700; color: #55555c">Puzzle 3</p>
      <p style="margin: 0; font-size: 23px; font-weight: 600; line-height: 1.55; letter-spacing: -0.015em; color: #2a2a2e">Jo, eleven days later, gave me the facts. The truth is, the job was done.</p>
      <a href="#play" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 8px; background: #111113; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none">
        Find them
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
      <a href="#together" style="align-self: center; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 600; color: #55555c; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: #c4c4ca">Play with a friend</a>
    </div>

    <section aria-labelledby="packs-title" style="padding: 0 20px; display: flex; flex-direction: column; gap: 4px">
      <h2 id="packs-title" style="margin: 0 0 8px; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 17px; color: #2c2c2e">OTHER PACKS</h2>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-top: 1px solid #e3e3e7">
        <sc-for list="{{packs}}" as="p" hint-placeholder-count="6">
          <li style="border-bottom: 1px solid #e3e3e7">
            <a href="#pack" style="display: flex; align-items: center; gap: 14px; min-height: 56px; text-decoration: none; color: #111113">
              <span aria-hidden="true" style="width: 12px; height: 12px; flex: none; border-radius: 4px; background: {{p.hue}}"></span>
              <span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 700">{{p.title}}</span>
              <span style="font-size: 13px; font-weight: 600; color: #6a6a72">{{p.meta}}</span>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>

  <nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px; background: #ffffff; border: 1px solid #e3e3e7; border-radius: 22px; box-shadow: 0 4px 0 #e3e3e7">
    <a href="#home" aria-label="Puzzles" aria-current="page" style="display: grid; place-items: center; min-height: 44px; border-radius: 14px; background: #e9f8f0; border: 2px solid #3ec486">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f8a58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </a>
    <a href="#people" aria-label="People" style="display: grid; place-items: center; min-height: 44px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f8dff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
    </a>
    <a href="#league" aria-label="League" style="display: grid; place-items: center; min-height: 44px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c98e00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>
    </a>
    <a href="#you" aria-label="You" style="display: grid; place-items: center; min-height: 44px">
      <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #d48cff; display: grid; place-items: center; font-size: 11px; font-weight: 800">A</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const off = { flag: false, done: false, now: false, ahead: false };
    const stops = [
      { ...off, line: false, done: true, stars: '★★★', aria: 'Puzzle 1, 3 stars. Play again' },
      { ...off, line: true, lineColor: '#111113', done: true, stars: '★★', aria: 'Puzzle 2, 2 stars. Play again' },
      { ...off, line: true, lineColor: '#111113', now: true, aria: 'Puzzle 3, next' },
      { ...off, line: true, lineColor: '#d6d6db', ahead: true, n: 4, ring: '#c4c4ca', fade: 1, aria: 'Puzzle 4, after puzzle 3' },
      { ...off, line: true, lineColor: '#d6d6db', ahead: true, n: 5, ring: '#c4c4ca', fade: 1, aria: 'Puzzle 5, the last of the pack' },
      { ...off, line: true, lineColor: '#d6d6db', flag: true, hue: '#f06a5a', label: 'ROAD TRIP' },
      { ...off, line: true, lineColor: '#e3e3e7', ahead: true, n: 1, ring: '#d6d6db', fade: 0.55, aria: 'Road trip, puzzle 1' },
      { ...off, line: true, lineColor: '#e3e3e7', ahead: true, n: 2, ring: '#d6d6db', fade: 0.45, aria: 'Road trip, puzzle 2' },
      { ...off, line: true, lineColor: '#e3e3e7', ahead: true, n: 3, ring: '#d6d6db', fade: 0.35, aria: 'Road trip, puzzle 3' },
    ];
    const packs = [
      ['In the lab', '0 of 9', '#9b8cff'],
      ['Night drive', '0 of 7', '#9b8cff'],
      ['Match day', '0 of 8', '#d48cff'],
      ['Hidden colours', '0 of 7', '#6aa3ff'],
      ['Nigerian names', '0 of 11', '#ff9f43'],
      ['Market day', '0 of 8', '#6aa3ff'],
    ];
    return { stops, packs: packs.map(([title, meta, hue]) => ({ title, meta, hue })) };
  }
}
</script>
</body>
</html>
