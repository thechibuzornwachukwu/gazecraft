<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Result, phone, detective's desk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#f6f6f7}
a{color:#111113}a:hover{color:#000000}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}60%{transform:translateY(-14px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes popb{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes slam{0%{transform:scale(2.6) rotate(-22deg);opacity:0}60%{transform:scale(.92) rotate(-7deg);opacity:1}100%{transform:scale(1) rotate(-9deg);opacity:1}}
@keyframes thud{0%,100%{transform:translateY(0)}35%{transform:translateY(5px)}}
@keyframes wiggle{0%,72%,100%{transform:rotate(0)}80%{transform:rotate(-2deg)}88%{transform:rotate(1.5deg)}94%{transform:rotate(-.5deg)}}
@keyframes slideup{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.hop{animation:hop 1.4s ease-in-out infinite}
.pop{animation:pop .35s ease-out both}
.popb{animation:popb .35s ease-out both}
.wiggle{animation:wiggle 3s ease-in-out 1s infinite;transform-origin:0 100%}
.flip{transition:transform .7s cubic-bezier(.5,0,.3,1)}
.slam{animation:slam .42s cubic-bezier(.3,.9,.4,1.15) .55s both}
.thud{animation:thud .25s ease-out .9s both}
.star1{animation:starpop .45s ease-out 1.15s both}
.star2{animation:starpop .45s ease-out 1.45s both}
.star3{animation:starpop .45s ease-out 1.75s both}
.rise{animation:pop .4s ease-out 2s both}
.slideup{animation:slideup .32s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .25s ease-out both}
@media (prefers-reduced-motion: reduce){.bob,.hop,.pop,.popb,.wiggle,.slam,.thud,.star1,.star2,.star3,.rise,.slideup,.fade{animation:none}.flip{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f6f7; font-family: Manrope, system-ui, sans-serif; color: #111113">

  <main style="padding: 44px 18px 40px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center">
      <a href="Main.dc.html" aria-label="Back to puzzles" style="width: 44px; height: 44px; border-radius: 50%; background: #ffffff; border: 1px solid #e3e3e7; box-shadow: 0 3px 0 #e3e3e7; display: grid; place-items: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </div>

    <section aria-label="Mochi" style="display: flex; align-items: flex-end; gap: 10px; min-height: 110px">
      <img class="{{mochiCls}}" src="{{mochi}}" alt="{{mochiAlt}}" style="width: 100px; height: auto; flex: none">
      <p role="status" class="{{bubbleCls}}" style="margin: 0 0 30px; padding: 13px 16px; background: #111113; color: #ffffff; border-radius: 18px 18px 18px 4px; font-size: 16px; font-weight: 700; line-height: 1.35">{{say}}</p>
    </section>

    <section aria-label="Case file" style="position: relative; padding-top: 30px">
      <span aria-hidden="true" style="position: absolute; top: 0; left: 0; height: 34px; padding: 0 18px; display: flex; align-items: center; border-radius: 14px 14px 0 0; background: #c9c0ff; font-family: Bungee, Manrope, sans-serif; font-size: 13px; color: #141416">IN THE LAB</span>
      <div class="{{thudCls}}" style="position: relative; padding: 12px; background: #c9c0ff; border-radius: 0 20px 20px 20px; box-shadow: 0 6px 0 #9b8cff">

        <div aria-hidden="{{sheetHidden}}" style="position: relative; padding: 20px 18px 22px; background: #ffffff; border: 1px solid #e3e3e7; border-radius: 14px; display: flex; flex-direction: column; gap: 18px">
          <div>
            <h1 style="margin: 0; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.1; color: #111113; max-width: {{titleMax}}">{{title}}</h1>
            <p style="margin: 6px 0 0; font-size: 15px; font-weight: 700; color: #55555c">{{sub}}</p>
          </div>
          <sc-if value="{{stampOn}}" hint-placeholder-val="{{ true }}">
            <span aria-hidden="true" class="{{stampCls}}" style="position: absolute; top: 14px; right: 12px; padding: 4px 10px; border: 3px solid #5a6b00; border-radius: 8px; transform: rotate(-9deg); background: #f4fbd6; font-family: Bungee, Manrope, sans-serif; font-size: 17px; line-height: 1.05; text-align: center; color: #5a6b00; opacity: {{stampOpacity}}">PUZZLE<br>SOLVED</span>
          </sc-if>

          <div style="display: flex; align-items: center; gap: 14px">
            <div role="img" aria-label="{{starsLabel}}" style="display: flex; gap: 4px">
              <sc-for list="{{stars}}" as="st" hint-placeholder-count="3">
                <img class="{{st.cls}}" src="/_blob/e0a30d7867daccf828ee24febdd83699" alt="" style="width: 52px; height: 52px; filter: {{st.filter}}; opacity: {{st.op}}">
              </sc-for>
            </div>
            <span style="font-size: 15px; font-weight: 800; color: #111113">{{starsLabel}}</span>
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #111113; color: #ffffff">
            <span aria-label="{{ptsLabel}}" style="font-family: Bungee, Manrope, sans-serif; font-size: 36px; line-height: 1; color: #d4f04c; font-variant-numeric: tabular-nums">{{pts}}</span>
            <span style="display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; font-weight: 700; color: #c4c4ca; line-height: 1.5">
              <sc-for list="{{lines}}" as="l" hint-placeholder-count="2"><span>{{l.t}}</span></sc-for>
            </span>
          </div>

          <sc-if value="{{hasMissed}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 10px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 800; color: #111113">Where the last one hid</h2>
              <sc-for list="{{missed}}" as="m" hint-placeholder-count="1">
                <p class="{{m.cls}}" style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #f6f6f7; display: flex; flex-direction: column; gap: 4px">
                  <span style="font-family: Bungee, Manrope, sans-serif; font-size: 15px; color: #111113">{{m.word}}</span>
                  <span style="font-size: 17px; font-weight: 600; line-height: 1.5; color: #2a2a2e">{{m.pre}}<mark style="padding: 1px 2px; border-radius: 5px; background: #111113; color: #ffffff">{{m.hit}}</mark>{{m.post}}</span>
                </p>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{hasHiding}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 12px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 800; color: #111113">3 still hiding</h2>
              <ul style="margin: 0; padding: 0; list-style: none; display: flex; gap: 10px">
                <sc-for list="{{hiding}}" as="h" hint-placeholder-count="3">
                  <li aria-label="{{h.aria}}" style="flex: 1; height: 56px; display: grid; place-items: center; border-radius: 12px; background: #ffffff; border: 1px solid #e3e3e7; box-shadow: 0 4px 0 #e3e3e7">
                    <span aria-hidden="true" style="display: flex; gap: 5px"><sc-for list="{{h.dots}}" as="d" hint-placeholder-count="4"><span style="width: 8px; height: 8px; border-radius: 50%; background: #6a6a72"></span></sc-for></span>
                  </li>
                </sc-for>
              </ul>
            </div>
          </sc-if>
        </div>

        <sc-if value="{{coverOn}}" hint-placeholder-val="{{ true }}">
          <button type="button" class="flip" onClick="{{open}}" aria-label="Open the case file" style="position: absolute; inset: 0; width: 100%; padding: 0; border: 1px solid #9b8cff; border-radius: 0 20px 20px 20px; background: #c9c0ff; transform-origin: 0 50%; transform: {{coverTransform}}; backface-visibility: hidden; -webkit-backface-visibility: hidden; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Manrope, system-ui, sans-serif; color: #141416">
            <svg aria-hidden="true" width="44" height="64" viewBox="0 0 24 36" fill="none" stroke="#55555c" stroke-width="2.2" stroke-linecap="round" style="position: absolute; top: -18px; right: 46px"><path d="M16 10v16a6 6 0 0 1-12 0V7a4 4 0 0 1 8 0v18a2 2 0 0 1-4 0V10"/></svg>
            <span class="wiggle" style="display: flex; flex-direction: column; align-items: center; gap: 14px">
              <img src="/_blob/7635086556d8c6e73873e2f04285f82e" alt="" style="width: 120px; height: 120px">
              <span style="font-family: Bungee, Manrope, sans-serif; font-size: 30px; line-height: 1; color: #141416">CASE FILE</span>
              <span style="padding: 6px 14px; border-radius: 999px; background: #ffffff; font-size: 15px; font-weight: 800; color: #141416">Ada · In the lab</span>
            </span>
          </button>
        </sc-if>
      </div>
    </section>

    <sc-if value="{{opened}}" hint-placeholder-val="{{ false }}">
      <div class="rise" style="display: flex; align-items: center; gap: 14px; padding-top: 4px">
        <sc-if value="{{low}}" hint-placeholder-val="{{ false }}">
          <a href="GamePhone.dc.html" style="flex: 1; min-height: 60px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; background: #d4f04c; box-shadow: 0 6px 0 #a8c22c; font-size: 18px; font-weight: 800; color: #0d0d0e; text-decoration: none">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0d0d0e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            Try again
          </a>
        </sc-if>
        <sc-if value="{{won}}" hint-placeholder-val="{{ true }}">
          <a href="GamePhone.dc.html" aria-label="Next case: puzzle 2 of 9" style="flex: 1; min-height: 60px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; background: #d4f04c; box-shadow: 0 6px 0 #a8c22c; font-size: 18px; font-weight: 800; color: #0d0d0e; text-decoration: none">
            Next case
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0d0d0e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
          </a>
          <button type="button" onClick="{{share}}" aria-label="Share" aria-haspopup="dialog" style="width: 60px; height: 60px; flex: none; border-radius: 50%; border: 1px solid #d6d6db; background: #ffffff; box-shadow: 0 4px 0 #d6d6db; display: grid; place-items: center; cursor: pointer">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
          </button>
        </sc-if>
      </div>
    </sc-if>
  </main>

  <sc-if value="{{sheetOn}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 20">
      <button type="button" class="fade" onClick="{{close}}" aria-label="Close sharing" tabindex="-1" style="position: absolute; inset: 0; width: 100%; border: none; padding: 0; background: rgba(17,17,19,.5); cursor: pointer"></button>
      <div role="dialog" aria-modal="true" aria-labelledby="share-title" class="slideup" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 18px 34px; background: #ffffff; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 18px">
        <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #d6d6db"></span>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h2 id="share-title" style="margin: 0; font-family: Bungee, Manrope, sans-serif; font-weight: 400; font-size: 20px; color: #111113">SHARE</h2>
          <button type="button" onClick="{{close}}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #e3e3e7; background: #f6f6f7; display: grid; place-items: center; cursor: pointer">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        <figure aria-label="{{cardLabel}}" style="margin: 0; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: #111113; color: #ffffff; transform: rotate(-1.5deg)">
          <img src="{{mochi}}" alt="" style="width: 64px; height: auto; flex: none">
          <figcaption style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
            <span style="font-family: Bungee, Manrope, sans-serif; font-size: 17px; color: #ffffff">IN THE LAB</span>
            <span aria-hidden="true" style="display: flex; gap: 2px"><sc-for list="{{stars}}" as="st" hint-placeholder-count="3"><img src="/_blob/e0a30d7867daccf828ee24febdd83699" alt="" style="width: 24px; height: 24px; filter: {{st.filter}}; opacity: {{st.opDark}}"></sc-for></span>
            <span style="font-size: 13px; font-weight: 700; color: #c4c4ca">{{cardLine}}</span>
          </figcaption>
        </figure>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <button type="button" onClick="{{save}}" style="min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 18px; border: 1px solid #e3e3e7; background: #ffffff; box-shadow: 0 4px 0 #e3e3e7; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: 800; color: #111113; cursor: pointer">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/></svg>
            {{saveText}}
          </button>
          <button type="button" onClick="{{send}}" style="min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 18px; border: 1px solid #e3e3e7; background: #ffffff; box-shadow: 0 4px 0 #e3e3e7; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: 800; color: #111113; cursor: pointer">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
            {{sendText}}
          </button>
          <button type="button" onClick="{{copy}}" style="min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 18px; border: 1px solid #e3e3e7; background: #ffffff; box-shadow: 0 4px 0 #e3e3e7; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: 800; color: #111113; cursor: pointer">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
            {{copyText}}
          </button>
        </div>
        <p role="status" style="margin: 0; min-height: 20px; text-align: center; font-size: 14px; font-weight: 700; color: #5a6b00">{{doneSay}}</p>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["4 of 5","all 5","2 of 5"],"default":"4 of 5"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false, gone: false, k: 0, sheet: false, done: null, n: 0 };
  }
  ends() {
    // 100 a word, minus 25 a tip-off; the time bonus (600 less the seconds) only when every word is found.
    return {
      '4 of 5': { stars: 2, found: 4, title: 'SOLID FINDING', time: '3:10', lines: ['4 found +400', '1 tip-off −25'], total: 375, closed: true, say: 'Done. Signed with a paw.', art: ['/_blob/d187597c53c1f65f02e75d28f635beff', 'Mochi the cat, cheering with a magnifier'] },
      'all 5': { stars: 3, found: 5, title: 'EVERY ONE. CLEAN SWEEP.', time: '2:08', lines: ['5 found +500', 'Time bonus +472'], total: 972, closed: true, say: 'A clean read. No tip-offs, no wrong picks.', art: ['/_blob/72ac21c6abd315fc09fce9f4cd789575', 'Mochi the cat, waving'] },
      '2 of 5': { stars: 0, found: 2, title: 'THEY HID WELL TODAY', time: '4:30', lines: ['2 found. Find 3 to keep the points.'], total: 0, closed: false, say: 'Two found. Three are still in there, and I bet you can spot them. Want another look?', art: ['/_blob/d187597c53c1f65f02e75d28f635beff', 'Mochi the cat, with a magnifier'] },
    };
  }
  open() {
    if (this.state.open) return;
    const calm = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.setState({ open: true, n: this.state.n + 1, k: calm ? 1 : 0 });
    setTimeout(() => this.setState({ gone: true }), calm ? 0 : 720);
    if (calm) return;
    const t0 = Date.now() + 1300;
    const tick = () => {
      const k = Math.min(1, Math.max(0, (Date.now() - t0) / 900));
      this.setState({ k: 1 - Math.pow(1 - k, 3) });
      if (k < 1) setTimeout(tick, 40);
    };
    setTimeout(tick, 1300);
  }
  renderVals() {
    const s = this.state;
    const key = this.props.result || '4 of 5';
    const E = this.ends()[key] || this.ends()['4 of 5'];
    const low = !E.closed;
    const stars = [0, 1, 2].map((j) => ({
      cls: s.open && j < E.stars ? 'star' + (j + 1) : '',
      filter: j < E.stars ? 'none' : 'grayscale(1)',
      op: j < E.stars ? 1 : 0.25,
      opDark: j < E.stars ? 1 : 0.35,
    }));
    const missed = key === '4 of 5' ? [{ word: 'MASS', pre: 'while To', hit: 'm ass', post: 'erted that a cider break', cls: s.open ? 'rise' : '' }] : [];
    const dots = (n) => Array.from({ length: n }, (_, j) => ({ j }));
    const hiding = [5, 4, 4].map((n) => ({ dots: dots(n), aria: n + ' letters, still hiding' }));
    const starsLabel = E.stars + ' of 3 stars';
    const total = E.total.toLocaleString('en-GB');
    const doneSay = { save: 'Image saved.', send: 'Sent.', copy: 'Link copied.' }[s.done] || '';
    return {
      title: E.title,
      titleMax: E.closed ? '60%' : '100%',
      sub: E.found + ' of 5 found · ' + E.time,
      stampOn: E.closed,
      stars,
      starsLabel,
      lines: E.lines.map((t) => ({ t })),
      pts: Math.round(E.total * s.k).toLocaleString('en-GB'),
      ptsLabel: total + ' points',
      hasMissed: missed.length > 0,
      missed,
      hasHiding: low,
      hiding,
      low,
      won: !low,
      mochi: E.art[0],
      opened: s.open,
      coverOn: !s.gone,
      coverTransform: s.open ? 'perspective(1400px) rotateY(-112deg)' : 'perspective(1400px) rotateY(0deg)',
      sheetHidden: s.open ? 'false' : 'true',
      stampCls: s.open ? 'slam' : '',
      stampOpacity: s.open ? 1 : 0,
      thudCls: s.open ? 'thud' : '',
      mochiCls: s.open && !low ? 'hop' : 'bob',
      mochiAlt: s.open ? E.art[1] : 'Mochi the cat, with a magnifier',
      bubbleCls: s.n % 2 ? 'popb' : 'pop',
      say: s.open ? E.say : 'Case file is ready, Ada. Open it up!',
      sheetOn: s.sheet,
      cardLabel: 'Share card: In the lab, ' + starsLabel + ', ' + E.found + ' of 5 found, ' + total + ' points',
      cardLine: E.found + ' of 5 found · ' + total + ' points · Gazecraft',
      saveText: s.done === 'save' ? 'Saved' : 'Save image',
      sendText: s.done === 'send' ? 'Sent' : 'Send',
      copyText: s.done === 'copy' ? 'Copied' : 'Copy link',
      doneSay,
      open: () => this.open(),
      share: () => this.setState({ sheet: true, done: null }),
      close: () => this.setState({ sheet: false, done: null }),
      save: () => this.setState({ done: 'save' }),
      send: () => this.setState({ done: 'send' }),
      copy: () => this.setState({ done: 'copy' }),
    };
  }
}
</script>
</body>
</html>
